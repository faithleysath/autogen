[project]
name = "orchestrator"
version = "0.1.0"
description = "Autogen v1 orchestrator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "docker",
    "grandalf",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "openai",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
orchestrator = "orchestrator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

name: autogen

services:
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-autogen-local}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AUTOGEN_WORKSPACE_ROOT: ${AUTOGEN_WORKSPACE_ROOT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${AUTOGEN_WORKSPACE_ROOT}
        target: ${AUTOGEN_WORKSPACE_ROOT}

  agent-dev:
    profiles: ["manual-agents"]
    build:
      context: .
      dockerfile: docker/agents/dev.Dockerfile
    image: autogen-agent-dev
    environment:
      SSH_SOURCE_DIR: /run/host-ssh
    volumes:
      - ${AGENT_SSH_DIR:-./.secrets/ssh}:/run/host-ssh:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]

  agent-e2e:
    profiles: ["manual-agents"]
    build:
      context: .
      dockerfile: docker/agents/e2e.Dockerfile
    image: autogen-agent-e2e
    environment:
      SSH_SOURCE_DIR: /run/host-ssh
    volumes:
      - ${AGENT_SSH_DIR:-./.secrets/ssh}:/run/host-ssh:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
    ipc: host
    command: ["sleep", "infinity"]
